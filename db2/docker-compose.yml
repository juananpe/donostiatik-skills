# Docker Compose for DB2 Community Edition — Buzón Donostia
#
# Start:  docker compose up -d
# Logs:   docker compose logs -f db2
# Ready when you see "Setup has completed" in logs.
#
# NOTE for Apple Silicon (M1/M2/M3):
#   DB2 is amd64-only. Enable Rosetta emulation in Docker Desktop or use:
#   docker compose -f docker-compose-amd64.yml up -d
#   (add `platform: linux/amd64` if needed)

services:
  db2:
    build: .
    platform: linux/amd64
    container_name: donostia-db2
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: Donostia2026!
      DBNAME: BUZONDIA
      # Optional: enable Oracle compatibility
      # ENABLE_ORACLE_COMPATIBILITY: "true"
    volumes:
      - db2_data:/database
    # healthcheck — DB2 takes 3-5 min to start
    healthcheck:
      test: ["CMD", "su", "-", "db2inst1", "-c", "db2 connect to BUZONDIA"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

volumes:
  db2_data:
    driver: local
